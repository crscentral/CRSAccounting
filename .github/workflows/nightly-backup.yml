name: Daily Company Back Up

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight (UTC)
  workflow_dispatch:
  push:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Individual Company Backups
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm init -y
          npm install pg
          
          node -e "
          const { Client } = require('pg');
          const fs = require('fs');
          
          async function run() {
            if (!process.env.SUPABASE_DB_URL) {
              console.error('Error: SUPABASE_DB_URL missing');
              process.exit(1);
            }
            
            // Bulletproof connection string parsing (handles unencoded @ in passwords)
            let rawUrl = process.env.SUPABASE_DB_URL;
            // Remove any query params like ?sslmode=require
            if (rawUrl.includes('?')) rawUrl = rawUrl.split('?')[0];
            
            // Greedy match up to the LAST @ symbol to perfectly extract passwords containing @
            const match = rawUrl.match(/postgres(?:ql)?:\/\/([^:]+):(.*)@([^@]+):(\d+)\/(.*)/);
            if (!match) {
              console.error('Error: Could not parse database URL correctly.');
              process.exit(1);
            }
            
            let user = match[1];
            let password = match[2];
            // If they URL encoded it (e.g. %40), unencode it. If not, leave it.
            if (password.includes('%')) password = decodeURIComponent(password);
            
            const host = match[3];
            const port = parseInt(match[4], 10);
            const database = match[5];

            const client = new Client({ 
              user,
              password,
              host,
              port,
              database,
              ssl: { rejectUnauthorized: false }
            });
            
            try {
              await client.connect();
              
              const res = await client.query('SELECT id, name FROM companies');
              const companies = res.rows;
              
              const tables = [
                'accounts', 'contacts', 'hotel_settings', 'hotel_expense_budget',
                'hotel_room_revenue_budget', 'forecast_entries', 'sales_invoices',
                'purchase_invoices', 'payment_receipts', 'hotel_expense_entries',
                'hotel_amc_contracts', 'hotel_room_stats', 'hotel_guest_invoices',
                'restaurant_daily_revenue', 'ledger_entries'
              ];
              
              if (!fs.existsSync('company_backups')) {
                fs.mkdirSync('company_backups');
              }
              
              for (const comp of companies) {
                const comp_id = comp.id;
                const comp_name = comp.name.replace(/[^a-zA-Z0-9 -_]/g, '').trim().replace(/ /g, '_');
                const backup_data = {};
                
                for (const table of tables) {
                  const tableRes = await client.query(\`SELECT * FROM \${table} WHERE company_id = $1\`, [comp_id]);
                  backup_data[table] = tableRes.rows;
                }
                
                fs.writeFileSync(\`company_backups/\${comp_name}_backup.json\`, JSON.stringify(backup_data, null, 2));
              }
              
              console.log('Successfully generated backups for ' + companies.length + ' companies.');
              await client.end();
            } catch (err) {
              console.error('Database Error:', err);
              process.exit(1);
            }
          }
          
          run();
          "

      - name: Zip Backups
        run: zip -r all_company_backups.zip company_backups/

      - name: Save Backup to Secure Vault
        uses: actions/upload-artifact@v4
        with:
          name: all-company-backups
          path: all_company_backups.zip
          retention-days: 90
