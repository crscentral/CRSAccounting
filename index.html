<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/CRSAccounting/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B3A6B" />
    <title>CRS Accounting</title>
    <meta name="description" content="CRS Accounting — finance and revenue management software by CRS Central." />

    <!-- PWA: installable "Add to Home Screen" app -->
    <link rel="manifest" href="/CRSAccounting/manifest.webmanifest" />

    <!-- iOS "Add to Home Screen" support (Safari ignores manifest.json for install UI) -->
    <link rel="apple-touch-icon" href="/CRSAccounting/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRS Accounting" />

    <!-- Android/Chrome install prompt support -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Restores the real path after 404.html's redirect (see public/404.html) -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
